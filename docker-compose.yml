---
services:
  main:
    build: .
    ports:
      - "8080:8080"
      - "8081:8081"
    env_file:
      - .env
    environment:
      # logging
      LOG_LEVEL: "info"

      # metrics
      METRICS_ENABLED: "true"
      METRICS_PORT: "8081"

      SERVER_NAME: "lfpweather-mcp"

      # upstream lfpweather-api. Point this at wherever the API runs; when
      # running the API in this same compose network, use its service name.
      LFPWEATHER_API_BASE_URL: "http://host.docker.internal:8080"
      # LFPWEATHER_API_KEY: ""
      LFPWEATHER_API_TIMEOUT: "10s"

      # transport: streamablehttp (default, use this for remote hosting),
      # sse (deprecated), or stdio. HTTP_PATH defaults to /mcp.
      TRANSPORT: "streamablehttp"
      HTTP_PORT: "8080"
      HTTP_PATH: "/mcp"

      # Bearer token clients must present as "Authorization: Bearer <token>".
      # Leave unset to disable auth for local development.
      # MCP_AUTH_TOKEN: "local-dev-token"

      LOCAL: "true"

      # tracing
      TRACING_ENABLED: "false"
      TRACING_SAMPLERATE: "1.0"
      TRACING_SERVICE: "lfpweather-mcp"
      TRACING_VERSION: "0.0.1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://lgtm:4317"

      # grpc (otlp tracing)
      GRPC_GO_LOG_VERBOSITY_LEVEL: 99
      GRPC_GO_LOG_SEVERITY_LEVEL: info

  lgtm:
    image: grafana/otel-lgtm
    ports:
      - "3000:3000" # Grafana UI
      - "4317:4317" # OTLP
      - "4318:4318" # OTLPHTTP
    volumes:
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - ./docker/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/grafana-dashboards.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
